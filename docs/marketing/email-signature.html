<!--
  SportsHub One email signature.

  HOW TO USE: open this file in a browser, select all (Cmd+A), copy (Cmd+C),
  then paste into Gmail > Settings > General > Signature. Paste the RENDERED
  page, never the source, or Gmail will show the markup as text.

  WHY IT IS BUILT LIKE THIS:

  · Tables and inline styles only. Gmail strips <style> blocks, and flexbox
    and grid do not exist in most mail clients, so structure has to live on
    the element itself.
  · The padding lives on a wrapper TD, not on the table. Padding set on a
    <table> is ignored by Outlook and clipped the text against the border.
  · A system font stack. Web fonts do not load in most clients, and the
    fallback is unpredictable mid-signature.
  · The mark is icon-n3-180.png, the navy tile, because it carries its own
    background and so reads on any ground. The wordmark PNG is ink on
    transparent and would disappear in dark mode.
  · Images are the SHIPPED PNGs from sportshubone.com. Never the SVGs: their
    text is set in a system stack that resolves differently per machine and
    moves the ONE badge off the mark (see the logo spec).
  · width and height are on the <img> so clients that block images still
    reserve the space instead of collapsing the layout.
  · The card is painted white on purpose. The name and company are ink
    #10142a, which is right on white and near invisible on a dark ground, and
    clients disagree about re-colouring signature text in dark mode. Painting
    it makes the result the same everywhere. To go transparent instead,
    remove bgcolor and the background-color, border and border-radius below,
    and accept that dark-mode readers may struggle.
-->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
  <tr>
    <td bgcolor="#ffffff" style="background-color:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <!-- The mark, shipped at 180px and shown at 56px so it stays crisp on retina. -->
          <td valign="top" style="padding:0 18px 0 0;">
            <a href="https://sportshubone.com" style="text-decoration:none;">
              <img src="https://sportshubone.com/brand/icon-n3-180.png"
                   width="56" height="56" alt="SportsHub One"
                   style="display:block;width:56px;height:56px;border:0;outline:none;text-decoration:none;border-radius:12px;" />
            </a>
          </td>

          <!-- The rule. A bordered empty cell, because a 1px <div> is not reliable in Outlook. -->
          <td style="width:1px;background-color:#e2e8f0;font-size:0;line-height:0;">&nbsp;</td>

          <td valign="top" style="padding:0 0 0 18px;">
            <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:20px;font-weight:700;color:#10142a;letter-spacing:-0.01em;padding:0 0 2px 0;">
                  Zia Khan
                </td>
              </tr>
              <tr>
                <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:18px;font-weight:600;color:#4f46e5;padding:0 0 1px 0;">
                  Founder and CEO
                </td>
              </tr>
              <tr>
                <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:18px;font-weight:600;color:#10142a;padding:0 0 10px 0;">
                  SportsHub One
                </td>
              </tr>

              <!-- The energy box as a short accent rule: the one place the orange appears. -->
              <tr>
                <td style="font-size:0;line-height:0;padding:0 0 10px 0;">
                  <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <tr><td style="width:24px;height:2px;background-color:#f24e1e;font-size:0;line-height:0;">&nbsp;</td></tr>
                  </table>
                </td>
              </tr>

              <tr>
                <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:19px;color:#475569;white-space:nowrap;">
                  <a href="tel:+10000000000" style="color:#475569;text-decoration:none;">+1 (000) 000-0000</a><br />
                  <a href="mailto:you@sportshubone.com" style="color:#475569;text-decoration:none;">you@sportshubone.com</a><br />
                  <a href="https://sportshubone.com" style="color:#4f46e5;text-decoration:none;font-weight:600;">sportshubone.com</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>

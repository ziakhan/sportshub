<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Work+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="_brand.css" />
<!--
  THE ANCHOR POST (2026-08-19) — everyone connected, not just compatible.

  Owner's brief: claim it plainly, make it about players, parents, clubs and
  leagues INTERACTING, and use no technical language. Referees, scorekeepers
  and trainers are complementary and stay out of the headline; four parties is
  the story.

  "EVERYONE CONNECTED. NOT JUST COMPATIBLE." The mismatch is the point —
  "everyone" is people, "compatible" is software — so it reads as: you
  connected the systems, we connected the people. It says "truly connected"
  without using a phrase every competitor homepage already claims.

  PLATFORM, NOT APP, and the deciding argument came from our own copy: the
  family scene promises "No account, no app store." If grandma needs no app,
  "the only app" contradicts a promise made one slide away. Leagues also buy
  platforms, not apps. The one exception stays the thesis line, "Youth
  basketball. All of it. One app." — that line is about relief from five
  tools, where "one platform" would sound bureaucratic.

  THE DEVICE IS THE TIMESTAMP, and v2 makes it the whole artifact. v1 spread
  6:04 PM across four small cards, which meant reading four things to receive
  one idea, at a size the owner could not read. Now there is one clock nobody
  can miss and the four seats sit under it as who it reached. Same argument,
  a quarter of the work, and it lands before the headline is read.

  Deliberately no product jargon, no talk of accounts or databases: a parent
  does not know what any of that means and does not need to. What they know is
  the feeling of being the last person told, and this is the picture of that
  never happening again.
-->
<style>
  .stage { gap: 34px; padding: 66px 60px 238px; }

  /* v3. v1 was four cards repeating one timestamp — too busy. v2 was the
     timestamp alone — too plain, and worse, DISCONNECTED: a number with no
     event attached says nothing about leagues or clubs. v3 keeps one object
     and puts the change back in, so the card reads top to bottom as a
     sentence: this moved, at this moment, and these four knew. */
  .receipt {
    flex: none;
    width: 100%;
    max-width: 860px;
    border-radius: 28px;
    border: 1.5px solid rgba(255, 255, 255, 0.16);
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
    overflow: hidden;
  }

  .change { padding: 30px 34px 26px; border-bottom: 1.5px dashed rgba(255, 255, 255, 0.18); }
  .change .ctx {
    font-family: var(--body); font-size: 22px; font-weight: 800;
    letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255, 255, 255, 0.42);
  }
  .change .times {
    display: flex; align-items: center; justify-content: center; gap: 26px; margin-top: 16px;
  }
  .change .was {
    font-family: var(--condensed); font-weight: 700; font-size: 76px; line-height: 1;
    color: rgba(255, 255, 255, 0.36); text-decoration: line-through;
    text-decoration-color: rgba(239, 68, 68, 0.75); text-decoration-thickness: 5px;
    font-variant-numeric: tabular-nums;
  }
  .change .arr { font-size: 50px; color: rgba(255, 255, 255, 0.4); }
  .change .now {
    font-family: var(--condensed); font-weight: 800; font-size: 84px; line-height: 1;
    color: #ffffff; font-variant-numeric: tabular-nums;
  }

  .stamp { padding: 26px 34px 30px; }
  .stamp .lbl {
    font-family: var(--body); font-size: 26px; font-weight: 600; color: rgba(255, 255, 255, 0.58);
  }
  .stamp .clock {
    font-family: var(--condensed); font-weight: 800; font-size: 132px; line-height: 0.92;
    color: var(--gold-300); font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
    text-shadow: 0 22px 70px rgba(245, 158, 11, 0.3);
  }
  .stamp .knew { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
  .stamp .knew span {
    display: inline-flex; align-items: center; gap: 11px;
    font-family: var(--display); font-size: 27px; font-weight: 700; color: #ffffff;
    background: rgba(61, 220, 151, 0.12); border: 1.5px solid rgba(61, 220, 151, 0.4);
    border-radius: 999px; padding: 11px 26px;
  }
  .stamp .knew span::before {
    content: "\2713"; color: #3DDC97; font-size: 0.85em; font-weight: 800;
  }

  h1 { font-size: 80px; line-height: 1.04; }
  h1 .hit { color: var(--gold-300); }
</style>
</head>
<body>
<div class="stage dark">
  <div class="receipt">
    <div class="change">
      <p class="ctx">Saturday &middot; Grade 10 Boys</p>
      <p class="times">
        <span class="was">2:00</span>
        <span class="arr">&rarr;</span>
        <span class="now">4:00 PM</span>
      </p>
    </div>
    <div class="stamp">
      <p class="lbl">All four knew at</p>
      <p class="clock">6:04 PM</p>
      <div class="knew">
        <span>League</span>
        <span>Club</span>
        <span>Player</span>
        <span>Parent</span>
      </div>
    </div>
  </div>

  <h1>Everyone connected.<br /><span class="hit">Not just compatible</span>.</h1>

  <p class="payoff">Nobody finds out <em>last</em>.</p>

  <div class="footer-brand">
    <span class="wm"><span class="s">Sports</span><span class="h">Hub</span><span class="one">ONE</span></span>
    <span class="domain">SportsHubOne.com</span>
  </div>
</div>
<script>const m = location.hash.replace("#", ""); if (m) document.body.classList.add(m);</script>
</body>
</html>

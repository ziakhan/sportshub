<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="_brand.css" />
<!--
  THE LAUNCH CARD (2026-08-19) — the announcement, deliberately calm.

  Owner's brief: stress OPENING THIS FALL, summarise the system without
  getting busy, and end on a call to action. So the date is the biggest thing
  on the card and everything else is one line or one row.

  WHAT IT DOES NOT DO. No feature list, no screenshots, no competitor jab, no
  numbers. Every other creative in the set argues; this one announces, and an
  announcement that argues is a poster. The four chips are the four parties,
  not the eight roles, because a summary that lists eight things is the busy
  version of itself.

  The wordmark is oversized on purpose. This is the one asset whose job is to
  make the name stick, so the brand leads and the copy follows.
-->
<style>
  .stage { gap: 0; padding: 96px 78px 250px; }

  .brand-lead { font-size: 92px; }
  .brand-lead .one { font-size: 0.26em; }

  .kicker {
    font-family: var(--body);
    font-size: 27px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.45);
    margin-top: 26px;
  }

  h1 {
    font-size: 132px;
    line-height: 1;
    margin-top: 30px;
  }
  h1 .hit { color: var(--gold-300); }

  .rule {
    width: 120px;
    height: 5px;
    border-radius: 99px;
    background: var(--hoop-500);
    margin: 44px 0;
  }

  .what {
    font-family: var(--body);
    font-size: 35px;
    font-weight: 500;
    line-height: 1.42;
    color: rgba(255, 255, 255, 0.78);
    max-width: 840px;
  }
  .what b { color: #ffffff; font-weight: 700; }

  .who {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 40px;
  }
  .who span {
    font-family: var(--display);
    font-size: 27px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.82);
    border: 1.5px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    padding: 12px 30px;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    margin-top: 54px;
    background: var(--gold-500);
    color: var(--ink-950);
    border-radius: 999px;
    padding: 22px 48px;
    font-family: var(--display);
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.01em;
    box-shadow: 0 26px 60px -22px rgba(245, 158, 11, 0.7);
  }
</style>
</head>
<body>
<div class="stage dark">
  <span class="wm brand-lead"><span class="s">Sports</span><span class="h">Hub</span><span class="one">ONE</span></span>

  <p class="kicker">Canadian youth basketball</p>

  <h1>Opening<br /><span class="hit">this fall</span>.</h1>

  <span class="rule"></span>

  <p class="what">
    One place for the league, the club, the player and the parent.
    <b>Registration to the final buzzer.</b>
  </p>

  <div class="who">
    <span>Leagues</span>
    <span>Clubs</span>
    <span>Players</span>
    <span>Parents</span>
  </div>

  <span class="cta">sportshubone.com</span>
</div>
<script>const m = location.hash.replace("#", ""); if (m) document.body.classList.add(m);</script>
</body>
</html>

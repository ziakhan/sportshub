<!--
  TEASER 1 of 2 (2026-08-19) — the pain teaser.

  Purpose: the first post on a zero-follower account. It reveals no product,
  no screenshots and no feature list. It states a thing every basketball
  parent has lived, then promises it ends, and nothing else. The reveal is
  what the follow is for.

  Dark stage on purpose: the consult's pattern for anticipation is dark ground
  with accent highlights, and it separates the teaser run from the product
  posts that follow, which are light.

  No date. A date you might miss is a liability; "this season" is a promise
  you can keep.
-->
<style>
  .stage { gap: 54px; padding: 90px 90px 250px; }
  h1 { font-size: 104px; line-height: 1.04; }
  h1 .hit { color: var(--gold-300); }

    font-family: var(--display);
    font-size: 76px;
    font-weight: 800;
    letter-spacing: -0.02em;

  }

    width: 140px;
    height: 5px;
    border-radius: 99px;

    font-size: 30px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.62);
    letter-spacing: 0.02em;
  }
</style>

<div class="stage dark">
  <span class="eyebrow">Coming this fall</span>

</div>

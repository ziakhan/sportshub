<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Work+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="_brand.css" />
<!--
  PLAYER TEASER 3 of 3 (2026-08-19) — Player of the Game.

  ⚠️ THIS IS NOT THE MIXTAPE POST, DELIBERATELY. "Post your mixtape" was
  asked for and is not buildable copy yet: `mixtape` returns zero hits across
  apps/web/src, and the social build order puts it at S5 with S0 not started.
  A teaser promising a mixtape would be selling something that does not exist
  and will not for a long time, to teenagers, which is the audience least
  likely to forgive it. When S5 ships, this file is the template to copy.

  Player of the Game is real today
  (app/(public)/live/[gameId]/components/potg-card.tsx) and is the better
  status hook regardless: a mixtape is something you make, POTG is something
  you are given, and being chosen is what gets screenshotted.

  Same no-faces rule as s9: jersey number and figures carry it, and the name
  shows first-name-last-initial exactly as an unconsented card renders.
-->
<style>
  .stage { gap: 46px; padding: 90px 70px 250px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: var(--gold-500);
    color: var(--ink-950);
    border-radius: 999px;
    padding: 18px 40px;
    font-family: var(--display);
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    box-shadow: 0 26px 54px -20px rgba(245, 158, 11, 0.6);
  }
  .badge svg { width: 34px; height: 34px; fill: var(--ink-950); }

  .card {
    width: 100%;
    max-width: 820px;
    background: linear-gradient(155deg, #16233d, #0d1729);
    border: 1px solid rgba(245, 158, 11, 0.35);
    border-radius: 34px;
    padding: 46px 48px;
    box-shadow: 0 50px 110px -40px rgba(0, 0, 0, 0.9);
    display: flex;
    align-items: center;
    gap: 38px;
  }
  .jersey {
    font-family: var(--condensed);
    font-weight: 800;
    font-size: 190px;
    line-height: 0.76;
    letter-spacing: -0.02em;
    color: transparent;
    -webkit-text-stroke: 4px var(--gold-500);
    font-variant-numeric: tabular-nums;
    flex: none;
  }
  .who { text-align: left; }
  .who .nm {
    display: block;
    font-family: var(--display);
    font-weight: 800;
    font-size: 64px;
    color: #ffffff;
    letter-spacing: -0.02em;
    line-height: 1.04;
  }
  .who .ln {
    display: block;
    font-family: var(--condensed);
    font-weight: 700;
    font-size: 46px;
    color: var(--gold-300);
    margin-top: 12px;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }
  .who .mt {
    display: block;
    font-family: var(--body);
    font-size: 25px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.45);
    margin-top: 10px;
  }

  h1 { font-size: 92px; line-height: 1.04; }
  h1 .hit { color: var(--gold-300); }
  .sub {
    font-family: var(--body);
    font-size: 32px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.6);
    max-width: 780px;
    line-height: 1.45;
  }
</style>
</head>
<body>
<div class="stage dark">
  <span class="badge">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.1 6.6.9-4.8 4.7 1.2 6.6L12 17.2 6.1 20.3l1.2-6.6L2.5 9l6.6-.9z"/></svg>
    Player of the Game
  </span>

  <div class="card">
    <span class="jersey">23</span>
    <span class="who">
      <span class="nm">Jayden T.</span>
      <span class="ln">21 PTS &middot; 7 REB &middot; 4 AST</span>
      <span class="mt">Force 62 &ndash; Huskies 58 &middot; Grade 10 Boys</span>
    </span>
  </div>

  <h1>Some nights, <span class="hit">it&rsquo;s you</span>.</h1>
  <p class="sub">Picked at the final buzzer, posted before you leave the gym.</p>

  <div class="footer-brand">
    <span class="wm"><span class="s">Sports</span><span class="h">Hub</span><span class="one">ONE</span></span>
    <span class="domain">sportshubone.com</span>
  </div>
</div>
<script>const m = location.hash.replace("#", ""); if (m) document.body.classList.add(m);</script>
</body>
</html>

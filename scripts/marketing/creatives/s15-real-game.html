<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="_brand.css" />
<!--
  LIVE SCORING v3 (2026-08-19). Owner: "we're not doing justice to what we
  offer" — show the clock, show a box score, and show more than points,
  rebounds and assists.

  He is right, and the underselling was mine. PlayerStat records points,
  rebounds, assists, STEALS, BLOCKS, turnovers, fouls and minutes, and the
  game page also carries shooting splits. v2 advertised a phone showing a
  score and a period table, which is a fraction of it.

  THE FIX IS A DIFFERENT CAPTURE, NOT A DRAWING. s14 tried to solve richness
  by hand-drawing a dense poster and was rejected for looking nothing like the
  product. public/shots/game-page.png is the real desktop game page and it
  already contains everything asked for: LIVE pill with Q3 and a running 9:10
  clock, the period table, GAME LEADERS split into Points / Rebounds /
  Assists / DEFENSE, and TEAM STATS with field goals, three-pointers, free
  throws, rebounds, assists and steals on two-sided bars.

  BOX SCORE, LEADERS OR PLAY-BY-PLAY? The owner asked which belongs at the
  bottom. The capture answers it better than a choice would: leaders AND team
  stats sit side by side, so one crop shows per-player depth and per-team
  depth at once. Play-by-play is the weakest of the three here, because it
  shows events rather than the breadth of what gets counted.

  Shown at the full 1440x900. An earlier 830 crop stopped just short of the
  steals row, which is the very stat the chips claim — the picture has to back
  the words on the card that is about depth.
-->
<style>
  .stage { gap: 26px; padding: 46px 44px 230px; }

  .browser {
    flex: none;
    width: 100%;
    max-width: 960px;
    border-radius: 20px;
    overflow: hidden;
    background: #232c42;
    box-shadow: 0 46px 100px -34px rgba(0, 0, 0, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .browser .bar { display: flex; align-items: center; gap: 10px; padding: 14px 20px; }
  .browser .bar i { width: 12px; height: 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); }
  .browser .bar .url {
    margin-left: 12px; background: rgba(0, 0, 0, 0.4); border-radius: 8px;
    padding: 6px 16px; font-family: var(--body); font-size: 19px; color: rgba(255, 255, 255, 0.6);
  }
  /* The FULL 1440x900 capture. A crop at 830 stopped just short of the
     steals row, which is exactly the stat the card is claiming. */
  .browser .shot { position: relative; aspect-ratio: 1440 / 900; overflow: hidden; background: #fff; }
  .browser .shot img { position: absolute; left: 0; top: 0; width: 100%; }

  h1 { font-size: 78px; line-height: 1.04; }
  /* Three chips have to hold one line here; the card is already dense. */
  .chips span { font-size: 26px; padding: 11px 24px; }
  h1 .hit { color: var(--gold-300); }
</style>
</head>
<body>
<div class="stage dark">
  <span class="eyebrow">One volunteer at the table</span>

  <div class="browser">
    <div class="bar">
      <i></i><i></i><i></i>
      <span class="url">sportshubone.com/live</span>
    </div>
    <div class="shot">
      <img src="../../../apps/web/public/shots/game-page.png"
           alt="The live game page: score, clock, period table, game leaders and team stats" />
    </div>
  </div>

  <h1>Not just <span class="hit">the score</span>.</h1>

  <div class="chips">
    <span>Steals</span>
    <span>Blocks</span>
    <span>Shooting splits</span>
  </div>

  <p class="payoff">Counted at the table. Live on <em>every phone</em>.</p>

  <div class="footer-brand">
    <span class="wm"><span class="s">Sports</span><span class="h">Hub</span><span class="one">ONE</span></span>
    <span class="domain">sportshubone.com</span>
  </div>
</div>
<script>const m = location.hash.replace("#", ""); if (m) document.body.classList.add(m);</script>
</body>
</html>

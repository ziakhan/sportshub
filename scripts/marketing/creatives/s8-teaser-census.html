<!--
  TEASER 2 of 2 (2026-08-19) — the credibility teaser.

  Purpose: post two. The pain teaser earns attention; this earns belief. It
  is the only asset that can prove work has already happened without showing
  the product, which is what stops a zero-follower account reading as vapour.

  ⚠️ THE NUMBER. "1,300+" is deliberately conservative. Local DB
  `youthbasketballhub` counts 1,323 clubs under the product's own visibility
  filters (publishedAt set, mergedIntoId null, isDemo false). The box, which
  is production, was last recorded at ~1,488 in the public directory. Both
  clear 1,300, so the claim is safe either way. Confirm the box number before
  raising it, and never print a count without naming the database it came
  from.

  Light stage: the teaser run alternates dark (feeling) and light (proof), so
  the grid reads as a set rather than a series of unrelated posts.
-->

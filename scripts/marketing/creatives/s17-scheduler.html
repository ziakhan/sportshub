<!--
  LEAGUE POST v2 (2026-08-19). v1 is scrapped and the owner is right about why.

  WHAT V1 GOT WRONG
  1. "0 double-booked courts" is not an achievement, it is the absence of a
     bug. A scheduler that double-books is broken. Advertising it advertises a
     low bar. Cut entirely.
  2. It led on "15 seconds", which describes the generate button, not the job.
     The planning — weekends, gyms, team estimates — is real work the operator
     does. Cut.
  3. It printed a league size (146 teams). Any size printed becomes a ceiling
     in the reader's head: a 1,256-team prospect reads 146 as a limit. And
     146/725 is the largest run documented anywhere in the repo, so a bigger
     number would have been an untested claim. No size number at all now.

  WHAT IT LEADS WITH INSTEAD, from lib/scheduler-v2/ledger.ts
  The burden ledger prices eight things per team (b2b, gap1, longGap,
  twoDates, early, late, styleMiss, windowMiss) on the owner's shape ladder
  (2026-08-08): a 2-4 slot same-day gap is BEST at zero; gap 1 is next; a long
  gap (5+) and a two-date weekend are EQUALLY bad; a back-to-back is
  forbidden-tier and gated to zero by acceptance test A7.

  And the placement objective is QUADRATIC:
    cost = Σ_teams [ (B_pre(t) + b(t))² − B_pre(t)² ]
  so one more burden point on an already-burdened team costs more than the
  same point on a fresh one. That is the differentiator and it is what the
  headline says in human words: the same families never get hit twice.

  The ladder is the artifact because it proves the thinking. Anyone can claim
  fairness; showing that a second trip on Sunday was deliberately priced level
  with a five-slot wait is a claim only somebody who built it can make.
-->
<style>
  .stage { gap: 30px; padding: 54px 56px 234px; }

  h1 { font-size: 74px; line-height: 1.05; }
  h1 .hit { color: var(--gold-300); }

  .ladder {
    flex: none;
    width: 100%;
    max-width: 860px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    text-align: left;
  }
  .rung {
    display: flex;
    align-items: center;
    gap: 20px;
    border-radius: 18px;
    padding: 18px 24px;
    border: 1.5px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.05);
  }
  .rung .what {
    font-family: var(--body);
    font-size: 27px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.9);
    line-height: 1.25;
  }
  .rung .verdict {
    margin-left: auto;
    flex: none;
    font-family: var(--body);
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 7px 18px;
  }
  .rung.best { border-color: rgba(61, 220, 151, 0.45); background: rgba(61, 220, 151, 0.1); }
  .rung.best .verdict { background: #3DDC97; color: #06301f; }
  .rung.ok .verdict { background: rgba(255, 255, 255, 0.16); color: rgba(255, 255, 255, 0.82); }
  .rung.bad { border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.08); }
  .rung.bad .verdict { background: var(--gold-500); color: #2a1a00; }
  .rung.no { border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.1); }
  .rung.no .verdict { background: var(--live-500); color: #ffffff; }

  .sub {
    font-family: var(--body); font-size: 28px; font-weight: 500;
    color: rgba(255, 255, 255, 0.62); max-width: 850px; line-height: 1.42;
  }
  .sub b { color: #ffffff; font-weight: 700; }
</style>
</head>
<body>
<div class="stage dark">
  <span class="eyebrow">For leagues</span>
  <h1>Nobody&rsquo;s team gets the<br /><span class="hit">bad weekend twice</span>.</h1>

  <div class="ladder">
    <span class="rung best">
      <span class="what">Two to four slots between games</span>
      <span class="verdict">Target</span>
    </span>
    <span class="rung ok">
      <span class="what">Only one slot to rest</span>
      <span class="verdict">Costs</span>
    </span>
    <span class="rung bad">
      <span class="what">A five-slot wait, or asked back a second day</span>
      <span class="verdict">Costs the same</span>
    </span>
    <span class="rung no">
      <span class="what">Two games in a row</span>
      <span class="verdict">Not allowed</span>
    </span>
  </div>

  <p class="payoff">And it costs <em>more</em> on a team that already carried one.</p>

  <div class="footer-brand">
    <span class="wm"><span class="s">Sports</span><span class="h">Hub</span><span class="one">ONE</span></span>
    <span class="domain">sportshubone.com</span>
  </div>
</div>
<script>const m = location.hash.replace("#", ""); if (m) document.body.classList.add(m);</script>
</body>
</html>

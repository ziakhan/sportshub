<!--
  LEAGUE POST 2 (2026-08-19) — the scheduler, which was the other hole.
  Fourteen statics and not one showed the thing a league operator would
  actually change platforms for.

  THE NUMBERS ARE THE OWNER'S OWN, from the SportsHub Capability Deck
  ("A full season, scheduled in about 15 seconds": 146 teams, 725 games
  placed, 0 double-booked courts, 0 back-to-back games). They are already
  vetted and already shown to leagues, so nothing new is being claimed.

  The two zeroes matter more than the fifteen seconds and are why they get
  equal size. Any tool can place games fast. Placing 725 of them with zero
  double-booked courts and zero back-to-backs is the part a person doing this
  by hand cannot promise, and every operator reading it knows that.

  The closing line is aimed at one specific memory: the three weekends lost
  to a spreadsheet. That is who this post is for.
-->
<style>
  .stage { gap: 40px; padding: 78px 62px 240px; }

  h1 { font-size: 84px; line-height: 1.04; }
  h1 .hit { color: var(--gold-300); }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    width: 100%;
    max-width: 840px;
  }
  .st {
    background: rgba(255, 255, 255, 0.06);
    border: 1.5px solid rgba(255, 255, 255, 0.14);
    border-radius: 22px;
    padding: 26px 20px 22px;
  }
  .st.zero { border-color: rgba(61, 220, 151, 0.4); background: rgba(61, 220, 151, 0.08); }
  .st .n {
    display: block;
    font-family: var(--condensed);
    font-weight: 800;
    font-size: 104px;
    line-height: 0.9;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .st.zero .n { color: #6ee7b7; }
  .st .l {
    display: block;
    font-family: var(--body);
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 12px;
    line-height: 1.25;
  }

  .sub {
    font-family: var(--body); font-size: 30px; font-weight: 500;
    color: rgba(255, 255, 255, 0.62); max-width: 820px; line-height: 1.42;
  }
  .sub b { color: #ffffff; font-weight: 700; }
</style>

<body>
<div class="stage dark">
  <span class="eyebrow">For leagues</span>
  <h1>A full season, scheduled in<br /><span class="hit">about 15 seconds</span>.</h1>

  <div class="grid">
    <span class="st"><span class="n">146</span><span class="l">Teams</span></span>
    <span class="st"><span class="n">725</span><span class="l">Games placed</span></span>
    <span class="st zero"><span class="n">0</span><span class="l">Double-booked courts</span></span>
    <span class="st zero"><span class="n">0</span><span class="l">Back-to-back games</span></span>
  </div>

  <p class="sub">The two zeroes are the hard part. <b>Anyone can place games fast.</b> Nobody doing this in a spreadsheet can promise you either of those.</p>

  <div class="footer-brand">
    <span class="wm"><span class="s">Sports</span><span class="h">Hub</span><span class="one">ONE</span></span>
    <span class="domain">sportshubone.com</span>
  </div>
</div>
